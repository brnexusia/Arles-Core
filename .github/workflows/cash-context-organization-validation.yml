name: Cash context organization validation

on:
  push:
    branches:
      - fix/cash-context-organization

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
          REDIS_URL: redis://127.0.0.1:6379
          EVOLUTION_BASE_URL: http://127.0.0.1:8080
          EVOLUTION_API_KEY: test
      - name: Run full test suite
        id: full
        continue-on-error: true
        run: npx vitest run --reporter=json --outputFile=vitest-full-results.json
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
          REDIS_URL: redis://127.0.0.1:6379
          EVOLUTION_BASE_URL: http://127.0.0.1:8080
          EVOLUTION_API_KEY: test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cash-context-full-vitest-results
          path: vitest-full-results.json
      - name: Fail when full suite failed
        if: steps.full.outcome == 'failure'
        run: exit 1
