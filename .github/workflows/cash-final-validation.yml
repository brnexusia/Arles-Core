name: Cash final validation

on:
  push:
    branches:
      - fix/cash-deterministic-context-final

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
          REDIS_URL: redis://127.0.0.1:6379
          EVOLUTION_BASE_URL: http://127.0.0.1:8080
          EVOLUTION_API_KEY: test
        run: npm run typecheck
      - name: 5000-message eval
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
          REDIS_URL: redis://127.0.0.1:6379
          EVOLUTION_BASE_URL: http://127.0.0.1:8080
          EVOLUTION_API_KEY: test
        run: npx vitest run tests/cash-real-world-5000.test.ts
      - name: Full suite
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
          REDIS_URL: redis://127.0.0.1:6379
          EVOLUTION_BASE_URL: http://127.0.0.1:8080
          EVOLUTION_API_KEY: test
        run: npm test
