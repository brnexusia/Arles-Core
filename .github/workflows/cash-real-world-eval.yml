name: Cash 10000-message synthetic eval

on:
  push:
    branches:
      - main
      - test/cash-synthetic-5000-20260817
    paths:
      - 'src/verticals/cash/**'
      - 'tests/cash-real-world-5000.test.ts'
      - 'tests/cash-daily-stateful-5000.test.ts'
      - '.github/workflows/cash-real-world-eval.yml'
  workflow_dispatch:

concurrency:
  group: cash-real-world-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic
          POSTGRES_DB: arles_cash_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U synthetic -d arles_cash_synthetic"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1:5432/arles_cash_synthetic
      REDIS_URL: redis://127.0.0.1:6379
      EVOLUTION_BASE_URL: http://127.0.0.1:65535
      EVOLUTION_API_KEY: synthetic-only
      OPENAI_API_KEY: ''
      CASH_OFFICIAL_NUMBER: '5500000000000'
      CASH_PAYMENT_MONTHLY_URL: https://example.invalid/mensal
      CASH_PAYMENT_QUARTERLY_URL: https://example.invalid/trimestral
      CASH_PAYMENT_ANNUAL_URL: https://example.invalid/anual
      CASH_MESSAGE_SILENCE_MS: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run 5000-message routing eval
        run: npx vitest run tests/cash-real-world-5000.test.ts

      - name: Build isolated test runtime
        if: always()
        run: npm run build

      - name: Migrate isolated test database
        if: always()
        run: npm run migrate

      - name: Run 5000-message stateful Cash eval
        if: always() && hashFiles('tests/cash-daily-stateful-5000.test.ts') != ''
        run: npx vitest run tests/cash-daily-stateful-5000.test.ts
