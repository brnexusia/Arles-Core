name: Deploy Arles Core to Easypanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: arles-core-production-deploy
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      REDIS_URL: redis://127.0.0.1:6379
      EVOLUTION_BASE_URL: https://evolution.invalid
      EVOLUTION_API_KEY: test-key
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Cash deterministic semantics
        run: >-
          npm test --
          tests/cash-financial-intent.test.ts
          tests/cash-intent-context.test.ts
          tests/cash-intent-execution-contract.test.ts
          tests/cash-projection-intent.test.ts
          tests/cash-all-time-aggregate-grammar.test.ts
          tests/cash-recent-batch-reference.test.ts
          tests/cash-screenshot-regressions.test.ts
          tests/cash-mixed-financial-narrative.test.ts
          tests/cash-pocket-transfer.test.ts
          tests/cash-pocket-receivables.test.ts
          tests/cash-pocket-closing.test.ts
          tests/cash-pocket-closing-flow.test.ts
          tests/cash-inherited-batch.test.ts

      - name: Trigger Easypanel deployment
        env:
          EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: |
          if [ -z "$EASYPANEL_DEPLOY_URL" ]; then
            echo "EASYPANEL_DEPLOY_URL secret is not configured yet; skipping deployment."
            exit 0
          fi

          curl --fail --show-error --silent \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 60 \
            "$EASYPANEL_DEPLOY_URL"