name: Patch Cash 5000 eval

on:
  push:
    branches:
      - fix/cash-deterministic-context-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cash-deterministic-context-v2
          fetch-depth: 0
      - name: Align evaluator with production routing
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('tests/cash-real-world-5000.test.ts')
          s = p.read_text()
          if 'classifyCashDeterministicLanguage' not in s:
              s = s.replace(
                  "let classifyCashCorpus: (input: string) => { intent: string };",
                  "let classifyCashCorpus: (input: string) => { intent: string };\nlet classifyCashDeterministicLanguage: (input: string) => { intent: string; canonical: string } | null;"
              )
              s = s.replace(
                  "  ({ classifyCashCorpus } = await import('../src/verticals/cash/conversation-corpus.js'));",
                  "  ({ classifyCashCorpus } = await import('../src/verticals/cash/conversation-corpus.js'));\n  ({ classifyCashDeterministicLanguage } = await import('../src/verticals/cash/deterministic-language.js'));"
              )
          old = """function route(input: string): Route {
  if (parseCashPocketDeleteReference(input)) return 'pocket-delete';
  if (parseCashPocketBalanceReference(input)) return 'pocket-balance';

  const report = parseCashReportRequest(input);
  if (report) return report.kind === 'weekly' ? 'weekly_report' : 'monthly_report';

  if (isCashForecastLanguage(input)) return 'schedule';
  if (parseCashProjection(input)) return 'projection';
  if (isCashDirectBalanceRequest(input)) return 'balance';
  if (isCashNaturalRecordListRequest(input)) return 'history';
"""
          new = """function route(input: string): Route {
  if (parseCashPocketDeleteReference(input)) return 'pocket-delete';
  if (isCashDirectBalanceRequest(input)) return 'balance';
  if (parseCashPocketBalanceReference(input)) return 'pocket-balance';

  const report = parseCashReportRequest(input);
  if (report) return report.kind === 'weekly' ? 'weekly_report' : 'monthly_report';

  const deterministicLanguage = classifyCashDeterministicLanguage(input);
  if (deterministicLanguage && deterministicLanguage.intent !== 'future_data') {
    return deterministicLanguage.intent as Route;
  }

  if (isCashForecastLanguage(input)) return 'schedule';
  if (parseCashProjection(input)) return 'projection';
  if (isCashNaturalRecordListRequest(input)) return 'history';
"""
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          if git diff --quiet -- tests/cash-real-world-5000.test.ts; then
            echo "Evaluator already aligned"
            exit 0
          fi
          git config user.name brnexusia
          git config user.email brnexusia@gmail.com
          git add tests/cash-real-world-5000.test.ts
          git commit -m "test(cash): align 5000 eval with deterministic layer"
          git push origin HEAD:fix/cash-deterministic-context-v2
