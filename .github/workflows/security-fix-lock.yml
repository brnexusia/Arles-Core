name: Temporary Core Security Lock Fix

on:
  push:
    branches: [beauty-production-20260902]

permissions:
  contents: write

concurrency:
  group: temporary-core-security-lock-fix
  cancel-in-progress: true

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beauty-production-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize package lock with security overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit normalized lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'security: update fast-uri transitive dependencies'
          git push origin HEAD:beauty-production-20260902
