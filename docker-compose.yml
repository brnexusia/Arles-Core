services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arles
      POSTGRES_USER: arles
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - arles_postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arles -d arles"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--protected-mode", "yes"]
    volumes:
      - arles_redis:/data
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  engine:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://arles:${POSTGRES_PASSWORD}@postgres:5432/arles
      REDIS_URL: redis://redis:6379
    expose:
      - "3000"
    networks:
      - edge
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.5

networks:
  edge:
  data:
    internal: true

volumes:
  arles_postgres:
  arles_redis:
